name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt is required for:"
            echo "${unformatted}"
            exit 1
          fi
      - name: Check module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "2025.1.1"
          install-go: false
          # v1 still pins actions/cache v4, which runs on deprecated Node.js 20.
          use-cache: false
      - name: Staticcheck
        run: staticcheck ./...
      - name: Vulnerability check
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.25.12"
          go-package: ./...
          repo-checkout: false
          cache: false

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Race tests
        run: go test -race ./...
      - name: CGO-free build
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/codex-history

  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3
      - name: Build package
        run: nix build --no-link 'path:.#codex-history'
      - name: Check packaged version
        run: |
          expected="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";/\1/p' package.nix)"
          if [[ -z "${expected}" ]]; then
            echo "::error::Could not read the expected version from package.nix"
            exit 1
          fi
          actual="$(nix run 'path:.#codex-history' -- --version)"
          case "${actual}" in
            "codex-history ${expected} "*) ;;
            *)
              echo "::error::Nix package reports an unexpected version: ${actual} (expected ${expected})"
              exit 1
              ;;
          esac

  required:
    name: Required
    if: always()
    needs: [quality, test, nix]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "${QUALITY_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${NIX_RESULT}" = "success"
