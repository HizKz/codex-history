<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">codex-history terminal interface</title>
  <desc id="desc">Synthetic conversation list and chat-style transcript demonstrating the two-pane terminal interface.</desc>
