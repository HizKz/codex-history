  <text x="34" y="160" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">Improve terminal navigation</text>
  <text x="34" y="187" fill="#aab2c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">sample-project · moments ago</text>
  <text x="34" y="241" fill="#d4d8e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Add local search</text>
  <text x="34" y="268" fill="#737b8c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">demo-app · yesterday</text>
  <text x="34" y="321" fill="#d4d8e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Review configuration</text>
