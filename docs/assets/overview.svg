  <text x="414" y="111" fill="#8bd5ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">Improve terminal navigation</text>
  <line x1="420" y1="146" x2="708" y2="146" stroke="#737b8c"/>
  <text x="788" y="151" text-anchor="middle" fill="#aab2c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">TURN 1</text>
  <line x1="868" y1="146" x2="1154" y2="146" stroke="#737b8c"/>
  <rect x="618" y="172" width="536" height="98" rx="10" fill="none" stroke="#a6da95" stroke-width="2"/>
  <text x="1130" y="194" text-anchor="end" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">You</text>
  <text x="638" y="224" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Make transcript scrolling work by visual line,</text>
  <text x="638" y="250" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">including narrow terminals and full-width text.</text>
  <text x="788" y="310" text-anchor="middle" fill="#c6a0f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">▶ Activity · 4 events</text>
