  <text x="766" y="558" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Great — keep conversation data local.</text>
  <line x1="0" y1="666" x2="1200" y2="666" stroke="#343943" stroke-width="2"/>
